<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMA Crossover Signal Bot</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --muted: #94a3b8;
            --buy: #10b981;
            --sell: #ef4444;
            --hold: #f5d20b;
            --accent: #3b82f6;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }
        .container { width: 100%; max-width: 720px; }
        header { margin-bottom: 1.5rem; }
        h1 { margin: 0 0 0.25rem; font-size: 1.5rem; }
        .subtitle { color: var(--muted); font-size: 0.9rem; margin: 0; }
        .search-bar {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        input {
            flex: 1;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            font-size: 1rem;
            text-transform: uppercase;
        }
        input:focus { outline: 2px solid var(--accent); border-color: transparent; }
        button {
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover:not(:disabled) { opacity: 0.92; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #submitBtn {
            font-size: 1rem; /* Adjust this value (e.g., 0.9rem, 1.1rem, 18px) */
        }
        .watchlist {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }
        .chip {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.35rem 0.75rem;
            font-size: 0.85rem;
            border-radius: 999px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .signal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .ticker-title { font-size: 2rem; font-weight: 700; margin: 0; }
        .badge {
            padding: 0.4rem 1rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.05em;
        }
        .badge.BUY { background: rgba(16, 185, 129, 0.15); color: var(--buy); border: 1px solid var(--buy); }
        .badge.SELL { background: rgba(239, 68, 68, 0.15); color: var(--sell); border: 1px solid var(--sell); }
        .badge.HOLD { background: rgba(245, 198, 11, 0.15); color: var(--hold); border: 1px solid var(--hold); }
        .metrics {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            border-top: 1px solid var(--border);
            padding-top: 1rem;
        }
        .metric-label { color: var(--muted); font-size: 0.8rem; display: block; }
        .metric-value { font-size: 1.25rem; font-weight: 600; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th, td { text-align: left; padding: 0.65rem 0.5rem; border-bottom: 1px solid var(--border); }
        th { color: var(--muted); font-weight: 500; }
        .error { color: var(--sell); margin-bottom: 1rem; font-size: 0.9rem; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>Trade Signal Scanner</h1>
        <p class="subtitle">10-Day vs. 30-Day Simple Moving Average Crossover (Alpaca IEX Feed)</p>
    </header>

    <form class="search-bar" id="searchForm">
        <input type="text" id="tickerInput" placeholder="Enter ticker (e.g. AAPL, MSFT, NVDA)" required />
        <button type="submit" id="submitBtn">Evaluate</button>
    </form>

    <div class="watchlist">
        <button type="button" class="chip" data-ticker="AAPL">AAPL</button>
        <button type="button" class="chip" data-ticker="MSFT">MSFT</button>
        <button type="button" class="chip" data-ticker="NVDA">NVDA</button>
        <button type="button" class="chip" data-ticker="SPY">SPY</button>
        <button type="button" class="chip" data-ticker="TSLA">TSLA</button>
    </div>

    <div id="errorBox" class="error hidden"></div>

    <div id="resultCard" class="card hidden">
        <div class="signal-header">
            <h2 class="ticker-title" id="resTicker">—</h2>
            <span class="badge" id="resBadge">—</span>
        </div>
        <div class="metrics">
            <div>
                <span class="metric-label">Latest Close</span>
                <span class="metric-value" id="resPrice">$0.00</span>
            </div>
            <div>
                <span class="metric-label">Evaluated At</span>
                <span class="metric-value" id="resTime" style="font-size: 0.95rem;">—</span>
            </div>
        </div>
    </div>

    <div class="card">
        <h3 style="margin-top: 0; font-size: 1rem;">Session Scan History</h3> 
        <table>
            <thead>
                <tr>
                    <th>Ticker</th>
                    <th>Signal</th>
                    <th>Close Price</th>
                    <th>Timestamp</th>
                </tr>
            </thead>
            <tbody id="historyBody">
                <tr><td colspan="4" style="color: var(--muted);">No tickers evaluated yet.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const form = document.getElementById('searchForm');
    const input = document.getElementById('tickerInput');
    const submitBtn = document.getElementById('submitBtn');
    const errorBox = document.getElementById('errorBox');
    const resultCard = document.getElementById('resultCard');
    const historyBody = document.getElementById('historyBody');
    const history = [];

    async function fetchSignal(ticker) {
        const clean = ticker.trim().toUpperCase();
        if (!clean) return;

        input.value = '';
        errorBox.classList.add('hidden');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Scanning...';

        try {
            const res = await fetch(`/api/signals/${encodeURIComponent(clean)}`);
            if (!res.ok) throw new Error(`HTTP ${res.status}: Failed to fetch signal for ${clean}`);
            const data = await res.json();

            renderResult(data);
            addToHistory(data);
        } catch (err) {
            errorBox.textContent = err.message;
            errorBox.classList.remove('hidden');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Evaluate';
        }
    }

    function renderResult(data) {
        resultCard.classList.remove('hidden');
        document.getElementById('resTicker').textContent = data.ticker;

        const badge = document.getElementById('resBadge');
        badge.textContent = data.signal;
        badge.className = `badge ${data.signal}`;

        document.getElementById('resPrice').textContent = `$${Number(data.price).toFixed(2)}`;
        document.getElementById('resTime').textContent = formatTimestamp(data.timestamp);
    }

    function addToHistory(data) {
        history.unshift(data);
        if (history.length > 10) history.pop();

        historyBody.innerHTML = history.map(item => `
            <tr>
                <td><strong>${item.ticker}</strong></td>
                <td><span class="badge ${item.signal}" style="padding: 0.15rem 0.5rem; font-size: 0.75rem;">${item.signal}</span></td>
                <td>$${Number(item.price).toFixed(2)}</td>
                <td style="color: var(--muted);">${formatTimestamp(item.timestamp)}</td>
            </tr>
        `).join('');
    }

    function formatTimestamp(ts) {
        if (!ts) return '—';
        const d = new Date(ts);
        return isNaN(d.getTime()) ? ts : d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        fetchSignal(input.value);
    });

    document.querySelectorAll('.chip').forEach(btn => {
        btn.addEventListener('click', () => {
            input.value = btn.dataset.ticker;
            fetchSignal(btn.dataset.ticker);
        });
    });

    // Auto-load AAPL on page open
    fetchSignal('AAPL');
</script>
</body>
</html>
